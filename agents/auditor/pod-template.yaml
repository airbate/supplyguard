apiVersion: v1
kind: Pod
metadata:
  name: auditor-agent
  labels:
    app: supplyguard
    agent: auditor
spec:
  serviceAccountName: auditor-sa
  containers:
    - name: worker
      image: supplyguard/auditor:latest
      env:
        - name: AGENT_ROLE
          value: arbiter
        - name: PRIVILEGED_MODE
          value: "true"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
      volumeMounts:
        - name: identity
          mountPath: /etc/supplyguard/identity
          readOnly: true
        - name: audit
          mountPath: /var/supplyguard/audit
  volumes:
    - name: identity
      configMap:
        name: auditor-identity
    - name: audit
      persistentVolumeClaim:
        claimName: audit-log-pvc
