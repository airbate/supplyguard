apiVersion: v1
kind: Pod
metadata:
  name: analyst-agent
  labels:
    app: supplyguard
    agent: analyst
spec:
  serviceAccountName: analyst-sa
  containers:
    - name: worker
      image: supplyguard/analyst:latest
      env:
        - name: AGENT_ROLE
          value: profiler
        - name: READONLY_MODE
          value: "true"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: identity
          mountPath: /etc/supplyguard/identity
          readOnly: true
  volumes:
    - name: identity
      configMap:
        name: analyst-identity
